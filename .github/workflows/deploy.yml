name: Deploy MkDocs to Ubuntu Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
            # Install MkDocs and Material theme with ALL extensions
          pip install mkdocs-material[imaging]
        
        # If you're using specific extensions, install them:
          pip install pillow cairosvg  # For image processing
          pip install mkdocs-minify-plugin
          
          # Optional: If you need PDF export or other features
          # pip install mkdocs-pdf-export-plugin
          # pip install mkdocs-mermaid2-plugin

      - name: Build site
        run: mkdocs build --clean

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v4.1.8
        with:
          sshPrivateKey: ${{ secrets.SSH_PRIVATE_KEY }}
          remoteHost: ${{ secrets.REMOTE_HOST }}
          remoteUser: ${{ secrets.REMOTE_USER }}
          remotePort: ${{ secrets.REMOTE_PORT }}
          target: ${{ secrets.REMOTE_TARGET }}
          source: "site/"
          args: "-rltgoDzvO --delete"
          exclude: ".git*, *.md, mkdocs.yml"

      - name: Verify Deployment
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Site should be live at: http://${{ secrets.REMOTE_HOST }}"
